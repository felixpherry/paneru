name: Rust

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "testing" ]

env:
  CARGO_TERM_COLOR: always
  # Match the local toolchain so a newer clippy can't fail CI with lints
  # nobody sees locally. Bump together with the local Rust.
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
    - run: cargo fmt --check
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo test --all-targets
    - run: cargo build --release --verbose
    - uses: actions/upload-artifact@v4
      with:
        name: paneru-macos
        path: target/release/paneru
